project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - clases-dsrs.qmd
    - clases-cscc.qmd
    - practicos.qmd
    - evaluaciones.qmd
    - datos.qmd
    - 1-data-science-rstudio/*.qmd
    - 2-ccss-computacionales/*.qmd
    - 3-practicos-conjuntos/2_codigo/*.qmd
    - 3-practicos-conjuntos/2_codigo/*.Rmd
    - 4-evaluaciones-conjuntas/*.qmd
    - "!4-evaluaciones-conjuntas/1-version-2025/**"
    - "!4-evaluaciones-conjuntas/2-version-2026/**"
  resources:
    - 0-datos/*.RData
    - 3-practicos-conjuntos/1_datos/1_originales/*.RData
    - 3-practicos-conjuntos/1_datos/1_originales/*.xlsx
    - 3-practicos-conjuntos/1_datos/1_originales/*.csv
    - 3-practicos-conjuntos/1_datos/2_procesados/*.RData
    - 3-practicos-conjuntos/1_datos/2_procesados/*.csv
    - 3-practicos-conjuntos/1_datos/2_procesados/*.zip
    - 3-practicos-conjuntos/3_resultados/*
    - 1-data-science-rstudio/*.qmd
    - 2-ccss-computacionales/*.qmd
    - 3-practicos-conjuntos/2_codigo/*.qmd
    - 3-practicos-conjuntos/2_codigo/*.Rmd
    - 4-evaluaciones-conjuntas/*.qmd

website:
  title: "Cursos Ciencia de Datos & CCSS Computacionales"
  favicon: 1-data-science-rstudio/images/logo-ucm-render.png
  navbar:
    background: "#003366"
    foreground: light
    logo: 1-data-science-rstudio/images/logo-ucm-render.png
    pinned: true
    left:
      - text: "Inicio"
        href: index.qmd
        icon: house-door
      - text: "Ciencia de Datos (DSRS)"
        href: clases-dsrs.qmd
        icon: bar-chart-line
      - text: "CCSS Computacionales (CSCC)"
        href: clases-cscc.qmd
        icon: diagram-3
      - text: "Prácticos"
        href: practicos.qmd
        icon: code-slash
      - text: "Evaluaciones"
        href: evaluaciones.qmd
        icon: clipboard-check
      - text: "Datos"
        href: datos.qmd
        icon: database
    right:
      - icon: github
        href: https://github.com/cristobalortizvilches/ucm-cursos-datos
        aria-label: Repositorio en GitHub

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Información General"
